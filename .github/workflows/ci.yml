name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Validate composer.json
        run: composer validate

      - name: PHP syntax lint
        run: find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 -P4 php -l

      # Install only the coding standard (not the module's magento/framework
      # dependency, which isn't needed to lint and is heavy to resolve).
      - name: Install Magento coding standard
        run: |
          composer global config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --no-interaction --no-progress magento/magento-coding-standard

      - name: Coding standard (Magento2)
        # Fails on errors; warnings are reported but non-fatal.
        run: |
          PHPCS="$(composer global config home)/vendor/bin/phpcs"
          "$PHPCS" --standard=Magento2 --extensions=php --runtime-set ignore_warnings_on_exit 1 Model registration.php Test
